<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>TBR 2.0</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.box{text-align:center;padding:28px}.box b{display:block;font-size:26px;margin-bottom:9px}.box span{color:#aebdd0;font-size:14px}</style>
</head>
<body>
<div class="box"><b>Ouverture directe de TBR</b><span>Chargement du cockpit…</span></div>
<script>
(async()=>{
  const DIRECT_VERSION="8.30.1-aimt-rules";
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>/^tbr-/i.test(k)).map(k=>caches.delete(k)));
    }
  }catch(e){console.warn("Nettoyage cache partiel",e);}
  try{
    localStorage.setItem("cc_version",DIRECT_VERSION);
    localStorage.setItem("tbr.app.installed.version",DIRECT_VERSION);
  }catch(e){}
  location.replace("/index.html?direct=20260808");
})().catch(()=>location.replace("/index.html?direct=20260808"));
</script>
</body>
</html>
