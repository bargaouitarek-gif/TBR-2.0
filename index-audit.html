<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TBR — Audit DCO</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:Arial,sans-serif}
    .boot{max-width:520px;padding:28px;text-align:center}.boot b{display:block;font-size:26px;margin-bottom:10px}.boot span{opacity:.75}.boot-error{color:#fecaca;font-weight:800}
  </style>
</head>
<body>
  <div class="boot" id="boot-msg"><b>TBR prépare le centre de contrôle DCO…</b><span>Chargement sécurisé de tes données locales.</span></div>
  <script>
    (async()=>{
      const response=await fetch("./dco-audit-bootstrap.js?v=20260726-command-center",{cache:"no-store"});
      if(!response.ok) throw new Error("Module DCO indisponible");
      let source=await response.text();
      source=source.replace(/\$\{/g,"\\${");
      (0,eval)(source);
    })().catch(error=>{
      const target=document.getElementById("boot-msg");
      if(target){target.className="boot-error";target.textContent="Le contrôle DCO n’a pas pu charger : "+(error&&error.message?error.message:error);}
    });
  </script>
</body>
</html>
