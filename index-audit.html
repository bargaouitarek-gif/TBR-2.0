<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>TBR 2.0</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.box{text-align:center;padding:28px}.box b{display:block;font-size:26px;margin-bottom:9px}.box span{color:#aebdd0;font-size:14px}</style>
</head>
<body>
<div class="box"><b>Ouverture de TBR</b><span>Chargement du Contrôle DCO stable…</span></div>
<script>
(async()=>{
  const VERSION="dco-native-4.0.1-stable";
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>/^tbr-/i.test(k)).map(k=>caches.delete(k)));
    }
    localStorage.setItem("tbr.dco.native.version",VERSION);

    const res=await fetch("/app-shell?stable="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("TBR indisponible (HTTP "+res.status+")");
    let html=await res.text();

    const claim='<script id="tbr-dco-claim-mail-loader" src="/tbr-dco-claim-mail.js?v=1.0.1"></'+'script>';
    const ai='<script id="tbr-ai-ui-v2-loader" src="/tbr-ai-ui-v2.js?v=2026.08.15"></'+'script>';
    if(/<\/body>/i.test(html)) html=html.replace(/<\/body>/i,claim+ai+'</body>');
    else html+=claim+ai;

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='';
    const box=document.createElement('section');
    box.style.cssText='margin:20px;padding:18px;border:1px solid #ef4444;border-radius:18px;background:#08111f;color:#fff;font:14px/1.5 system-ui';
    box.innerHTML='<b style="color:#fca5a5">TBR n’a pas pu démarrer</b><p>Le fichier principal n’a pas pu être chargé. Ferme puis rouvre l’application.</p>';
    document.body.appendChild(box);
  }
})();
</script>
</body>
</html>
