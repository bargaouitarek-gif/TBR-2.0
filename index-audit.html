<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="tbr-icon.svg" type="image/svg+xml">
  <title>TBR — Démarrage stable</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .boot{width:min(92vw,560px);padding:30px;text-align:center}
    .boot b{display:block;font-size:27px;margin-bottom:10px}
    .boot span{display:block;color:#aebdd0;line-height:1.5}
    .boot-error{width:min(92vw,580px);padding:28px;text-align:center;color:#fecaca;font-weight:800}
    .boot-error button{width:100%;margin-top:18px;border:0;border-radius:16px;padding:16px;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;font-size:15px;font-weight:900}
  </style>
</head>
<body>
  <div class="boot" id="boot-msg"><b>Ouverture sécurisée de TBR…</b><span>Retour au dernier moteur stable. Tes ventes, tes DCO et tes documents restent conservés.</span></div>
  <script>
  (async()=>{
    const STABLE_VERSION="2026.07.26-android-share-v16";
    const RELEASE_VERSION="2026.08.02-stable-recovery-v26";
    const target=document.getElementById("boot-msg");

    function installChallengeTestButton(){
      const inject=()=>{
        if(document.getElementById("tbr-challenge-test-launcher")) return;
        if(!document.body) return;
        const button=document.createElement("button");
        button.id="tbr-challenge-test-launcher";
        button.type="button";
        button.textContent="Tester challenge juillet";
        button.setAttribute("aria-label","Ouvrir le test du challenge juillet 2026");
        button.style.cssText="position:fixed;right:14px;bottom:92px;z-index:2147483647;border:1px solid rgba(134,239,172,.55);border-radius:999px;padding:11px 15px;background:linear-gradient(135deg,#16a34a,#0891b2);color:#fff;font:900 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;box-shadow:0 14px 34px rgba(0,0,0,.35);cursor:pointer";
        button.onclick=()=>{
          try{sessionStorage.setItem("tbr.challenge.opened.from.app","1");}catch(error){}
          location.href="/challenge?from=tbr-app&v="+Date.now();
        };
        document.body.appendChild(button);
      };
      inject();
      const timer=setInterval(inject,1200);
      window.setTimeout(()=>clearInterval(timer),45000);
    }

    installChallengeTestButton();

    try{
      if("serviceWorker" in navigator){
        const registrations=await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(registration=>registration.unregister().catch(()=>false)));
      }
      if("caches" in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(key=>/^tbr-/i.test(key)).map(key=>caches.delete(key)));
      }
    }catch(error){
      console.warn("Nettoyage technique partiel",error);
    }

    try{
      localStorage.setItem("tbr.app.installed.version",RELEASE_VERSION);
      localStorage.setItem("cc_version",RELEASE_VERSION);
    }catch(error){
      console.warn("Version locale non synchronisée",error);
    }

    target.innerHTML="<b>Moteur stable retrouvé ✓</b><span>Chargement de ton tableau de bord…</span>";

    await new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      script.src=new URL(`document-intake-entry-v14.js?v=${encodeURIComponent(STABLE_VERSION)}-${Date.now()}`,location.href).href;
      script.async=true;
      script.onload=resolve;
      script.onerror=()=>reject(new Error("Le moteur stable n’a pas pu être téléchargé"));
      document.head.appendChild(script);
    });

    installChallengeTestButton();

    window.setTimeout(()=>{
      const current=document.getElementById("boot-msg");
      if(current&&current.isConnected){
        current.className="boot-error";
        current.innerHTML="TBR n’a pas terminé son ouverture.<br><button onclick='location.reload()'>Relancer proprement</button>";
      }
    },15000);
  })().catch(error=>{
    console.error(error);
    const target=document.getElementById("boot-msg");
    if(target){
      target.className="boot-error";
      target.innerHTML="TBR n’a pas pu démarrer : "+(error&&error.message?error.message:error)+"<br><button onclick='location.reload()'>Réessayer</button>";
    }
  });
  </script>
</body>
</html>
