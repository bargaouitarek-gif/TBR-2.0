<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>TBR 2.0</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.box{text-align:center;padding:28px}.box b{display:block;font-size:26px;margin-bottom:9px}.box span{color:#aebdd0;font-size:14px}</style>
</head>
<body>
<div class="box"><b>Ouverture de TBR</b><span>Chargement du Contrôle DCO natif 4.0…</span></div>
<script>
(async()=>{
  const VERSION="dco-native-4.0.0";
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>/^tbr-/i.test(k)).map(k=>caches.delete(k)));
    }
    localStorage.setItem("tbr.dco.native.version",VERSION);

    const res=await fetch("/app-shell?dcoNative="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("TBR indisponible");
    const html=await res.text();

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    location.replace("/app-shell?direct="+Date.now());
  }
})();
</script>
</body>
</html>
