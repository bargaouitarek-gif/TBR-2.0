name: Fix DCO GitHub Pages loader

on:
  push:
    paths:
      - '.github/workflows/fix-dco-github-pages-loader.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DCO loaders for project Pages path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<script id="tbr-dco-claim-mail-loader" src="/tbr-dco-claim-mail.js?v=1.0.2"></script>'
          new = '<script id="tbr-dco-claim-mail-loader" src="./tbr-dco-claim-mail.js?v=1.6.0"></script>\n<script id="tbr-dco-dashboard-fix-loader" src="./tbr-dco-dashboard-fix.js?v=1.0.0"></script>'
          if old in text:
              text = text.replace(old, new, 1)
          elif './tbr-dco-claim-mail.js' not in text:
              raise SystemExit('Expected DCO loader not found; refusing unsafe rewrite')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit repaired loader
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No loader change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(dco): load runtime correctly on GitHub Pages'
          git push origin HEAD:main
