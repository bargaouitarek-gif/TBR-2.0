name: Run DCO step4 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'refactor/dco-index-step4' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dco-index-step4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply canonical DCO step4 patch
        run: python3 tools/patch_dco_step4.py
      - name: Validate patched runtime
        run: |
          node --check tbr-dco-engine.js
          node --check tbr-dco-claim-mail.js
          node --check tbr-dco-dashboard-fix.js
          node tests/dco-final-reliability-check.js
          node validate-dco-build.js
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: connect index DCO to canonical engine"
          git push origin HEAD:refactor/dco-index-step4
