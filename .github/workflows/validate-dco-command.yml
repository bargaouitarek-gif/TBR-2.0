name: Validate DCO Command Center

on:
  push:
    branches:
      - redesign-dco-command-center
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate generated DCO page
        run: node validate-dco-build.js
