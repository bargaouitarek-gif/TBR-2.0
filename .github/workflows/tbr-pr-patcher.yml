name: TBR focused DCO patcher

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-dco:
    if: github.event.pull_request.head.ref == 'agent/dco-audit-focus'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DCO audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/dco-audit-focus
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused DCO audit redesign
        run: python3 tools/patch_dco_audit_focus.py
      - name: Validate DCO priorities
        run: |
          grep -q 'function parseClientRows(pages)' index.html
          grep -q 'matchKey:num' index.html
          grep -q 'Il te manque' index.html
          grep -q 'Préparer le mail de réclamation' index.html
          grep -q 'dcoClaimCases' index.html
          grep -q 'filter(a=>a.statut!=="ok")' index.html
          python3 -m py_compile tools/patch_dco_audit_focus.py
      - name: Commit focused DCO audit to branch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'TBR Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Focus TBR on actionable DCO audit'
          git push origin HEAD:agent/dco-audit-focus
