name: TBR Render Guard — DCO 4.1 Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tbr-dco-native-v4.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed DCO template literal
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          bad = 'niveau:`B — règle 25% contrôlée ; base CA TBR à confronter aux pièces · CA packs ${money(r.caPacks||0)}`${promoAbo.months?'
          good = 'niveau:`B — règle 25% contrôlée ; base CA TBR à confronter aux pièces · CA packs ${money(r.caPacks||0)}${promoAbo.months?'

          count = s.count(bad)
          if count != 1:
              raise SystemExit(f'Expected exactly one malformed DCO template literal, found {count}')

          s = s.replace(bad, good, 1)
          p.write_text(s, encoding='utf-8')
          print('Malformed template literal repaired exactly once.')
          PY

      - name: Parse the complete React JSX before commit
        run: |
          set -euo pipefail
          rm -rf /tmp/tbr-parse
          mkdir -p /tmp/tbr-parse
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script\s+type=["\']text/babel["\'][^>]*>([\s\S]*?)</script>', html, flags=re.I)
          if len(blocks) != 1:
              raise SystemExit(f'Expected exactly one text/babel app block, found {len(blocks)}')
          Path('/tmp/tbr-parse/app.jsx').write_text(blocks[0], encoding='utf-8')
          print(f'Extracted React app: {len(blocks[0])} chars')
          PY
          cd /tmp/tbr-parse
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund @babel/parser@7
          node <<'NODE'
          const fs = require('fs');
          const parser = require('@babel/parser');
          const src = fs.readFileSync('app.jsx', 'utf8');
          parser.parse(src, {
            sourceType: 'script',
            allowReturnOutsideFunction: false,
            plugins: ['jsx']
          });
          console.log('Babel JSX parse: OK');
          NODE

      - name: Verify critical render invariants
        run: |
          set -euo pipefail
          grep -q 'ReactDOM.render(<App/>,document.getElementById("root"));' index.html
          grep -q 'DCO Expert 4.1 · NATIF · DOUBLE-SOURCE' index.html
          grep -q 'Contrôle des sources du DCO' index.html
          grep -q 'tbr_dco_cache_v5_double_source' index.html
          if grep -Fq 'CA packs ${money(r.caPacks||0)}`${promoAbo.months?' index.html; then
            echo 'Malformed template literal still present' >&2
            exit 1
          fi
          echo 'Critical render invariants: OK'

      - name: Commit only after parser and guards pass
        run: |
          set -euo pipefail
          git config user.name 'TBR Render Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'fix: restore TBR render after DCO 4.1 syntax regression'
          git push
