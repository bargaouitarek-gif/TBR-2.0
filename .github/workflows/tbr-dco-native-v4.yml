name: TBR DCO Native v4 Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tbr-dco-native-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source-first patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_dco_v4.py')
          s=p.read_text(encoding='utf-8')
          old="s, n = parser_re.subn('\\n' + parser_new, s, count=1)"
          new="s, n = parser_re.subn(lambda m: '\\n' + parser_new, s, count=1)"
          if old not in s:
              raise SystemExit('regex replacement line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python .github/scripts/patch_dco_v4.py
      - name: Verify patched source
        run: |
          set -euo pipefail
          grep -q 'DCO Expert 4.0 · NATIF · SOURCE-FIRST' index.html
          grep -q 'tbr_dco_cache_v4_source_first' index.html
          grep -q 'getPalierVDJuly2026' index.html
          grep -q 'salesPageIndex' index.html
          grep -q 'sourceFirstJuly?round2(globalVerseEnMoins)' index.html
      - name: Commit native DCO 4.0
        run: |
          set -euo pipefail
          git config user.name 'TBR DCO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: DCO 4.0 natif source-first et parseur PDF sûr'
          git push
