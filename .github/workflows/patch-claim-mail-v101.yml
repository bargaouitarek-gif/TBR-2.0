name: Patch DCO claim mail v1.0.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-claim-mail-v101.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Support stable DCO v4 cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tbr-dco-claim-mail.js')
          s=p.read_text(encoding='utf-8')
          old="""  function getSource(){
    const c5=J(localStorage.getItem('tbr_dco_cache_v5_double_source'));
    if(c5&&c5.data)return{cache:c5,data:c5.data,key:'tbr_dco_cache_v5_double_source'};
    const c2=J(localStorage.getItem('tbr_dco_cache_v2'));
    if(c2&&c2.data)return{cache:c2,data:c2.data,key:'tbr_dco_cache_v2'};
    return null;
  }"""
          new="""  function getSource(){
    const c5=J(localStorage.getItem('tbr_dco_cache_v5_double_source'));
    if(c5&&c5.data)return{cache:c5,data:c5.data,key:'tbr_dco_cache_v5_double_source'};
    const c4=J(localStorage.getItem('tbr_dco_cache_v4_source_first'));
    if(c4&&c4.data)return{cache:c4,data:c4.data,key:'tbr_dco_cache_v4_source_first'};
    const c2=J(localStorage.getItem('tbr_dco_cache_v2'));
    if(c2&&c2.data)return{cache:c2,data:c2.data,key:'tbr_dco_cache_v2'};
    return null;
  }"""
          if old not in s:
              raise SystemExit('getSource block not found')
          s=s.replace(old,new,1).replace("const VERSION='1.0.0';","const VERSION='1.0.1';",1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "tbr_dco_cache_v4_source_first" tbr-dco-claim-mail.js
          grep -q "VERSION='1.0.1'" tbr-dco-claim-mail.js
      - name: Commit patch
        run: |
          git config user.name 'TBR Claim Mail Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tbr-dco-claim-mail.js
          git commit -m 'fix: read stable DCO v4 cache in claim mail assistant'
          git push
