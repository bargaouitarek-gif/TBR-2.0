name: TBR DCO multiline v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tbr-dco-multiline-v2.yml'
      - 'tools/patch_dco_multiline_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply DCO parser fix
        run: python3 tools/patch_dco_multiline_v2.py
      - name: Verify multiline client case
        run: |
          grep -q 'function parseClientRows(pages)' index.html
          grep -q 'const rows=parseClientRows(allPageLines);' index.html
          grep -q 'const installs=parseInstallRows(installText);' index.html
      - name: Commit application correction
        run: |
          if git diff --quiet -- index.html; then
            echo 'No application change needed'
            exit 0
          fi
          git config user.name 'TBR Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix DCO clients split across lines and pages'
          git push
