name: Embed DCO claim mail v1.0.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/embed-dco-claim-mail-v102.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed claim mail loader in raw app shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="tbr-dco-claim-mail-loader"'
          tag='<script id="tbr-dco-claim-mail-loader" src="/tbr-dco-claim-mail.js?v=1.0.2"></script>'
          if marker not in s:
              pos=s.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('closing body not found')
              s=s[:pos]+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
          grep -q 'className="dco-v9"' index.html
          grep -q 'id="tbr-dco-claim-mail-loader"' index.html
          grep -q '/tbr-dco-claim-mail.js?v=1.0.2' index.html

      - name: Commit embedded loader
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Loader already embedded'
            exit 0
          fi
          git config user.name 'TBR Claim Mail Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: charger le mail DCO directement dans le cockpit TBR'
          git push
