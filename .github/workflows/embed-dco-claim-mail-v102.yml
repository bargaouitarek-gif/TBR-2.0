name: Install native DCO claim mail v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/embed-dco-claim-mail-v102.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch native React DCO control
        run: python .github/scripts/patch_native_dco_mail_v2.py

      - name: Validate native integration
        run: |
          set -euo pipefail
          grep -q 'id="dco-native-mail-v2"' index.html
          grep -q 'uniquement les écarts en ta défaveur' index.html
          grep -q 'TOTAL DES ÉCARTS EN MA DÉFAVEUR À VÉRIFIER' index.html
          grep -q 'Pourquoi :' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script\s+type=["\x27]text/babel["\x27][^>]*>([\s\S]*?)</script>',html,flags=re.I)
          if len(blocks)!=1:
              raise SystemExit(f'Expected one Babel block, found {len(blocks)}')
          Path('/tmp/tbr-app.jsx').write_text(blocks[0],encoding='utf-8')
          PY
          rm -rf /tmp/tbr-parser && mkdir /tmp/tbr-parser
          cd /tmp/tbr-parser
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund @babel/parser@7
          node - <<'NODE'
          const fs=require('fs');
          const parser=require('@babel/parser');
          parser.parse(fs.readFileSync('/tmp/tbr-app.jsx','utf8'),{sourceType:'script',plugins:['jsx']});
          console.log('Native DCO JSX parse OK');
          NODE

      - name: Commit native integration
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Native DCO mail already integrated'
            exit 0
          fi
          git config user.name 'TBR Native DCO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'feat: mail DCO uniquement montants manquants et détaillés'
          git push
