name: Apply diagnostic export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-diagnostic-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch index
        run: python .github/scripts/patch_diagnostic_export.py
      - name: Guard read-only export
        run: |
          grep -q 'Export diagnostic' index.html
          grep -q 'mode:"lecture-seule-localStorage"' index.html
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No change'
          else
            git commit -m 'feat: ajouter export diagnostic TBR en lecture seule'
            git push origin HEAD:main
          fi
