name: Run JUMPER-only removal once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-remove-jumper-only.yml'

permissions:
  contents: write

jobs:
  patch-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-jumper-only
          fetch-depth: 0

      - name: Remove JUMPER only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def sub1(pattern,repl,label):
              global s
              s2,n=re.subn(pattern,repl,s,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              s=s2

          sub1(r'\n// ── JUMPERS — Coach proactif animé ──.*?\n// ── ONBOARDING simple ──','\n// ── ONBOARDING simple ──','JUMPER main block')

          state="""  const [onboardingDone,setOnboardingDoneR]=useState(()=>LD('jumper_onboarding',false));
          const setOnboardingDone=()=>{SV('jumper_onboarding',true);setOnboardingDoneR(true);};
          const [jumperProfile,setJumperProfileR]=useState(()=>LD('jumper_profile',null));
          const setJumperProfile=(p)=>{SV('jumper_profile',p);setJumperProfileR(p);};
          """
          if s.count(state)!=1:
              raise SystemExit(f'JUMPER state block expected once, found {s.count(state)}')
          s=s.replace(state,'',1)

          for snippet,label in [
              ('    <JumpersFloat syn={syn} agent={agent} moisActif={moisActif} />\n','JUMPER render'),
              ('  const plan=getJumperCoachPlan(syn,moisActif,objectifEuros,objV,objVD,rdvVFMois,moisConfig,status);\n','JUMPER plan'),
              ('  const warning=!onTrack||projVD<objVD;\n','JUMPER warning'),
          ]:
              if s.count(snippet)!=1:
                  raise SystemExit(f'{label}: expected once, found {s.count(snippet)}')
              s=s.replace(snippet,'',1)

          sub1(r'\nfunction getMoisProgress\(moisActif\)\{.*?\nfunction SyntheseView\(','\nfunction SyntheseView(','JUMPER coach engine')
          sub1(r'\n\s*<div className="flight-copilot">.*?</div>\s*\n\s*<div className="flight-mini-panel">','\n        <div className="flight-mini-panel">','JUMPER home card')

          s=s.replace('grid-template-columns:1.35fr .8fr .8fr','grid-template-columns:repeat(2,minmax(0,1fr))')
          s=s.replace('grid-template-columns:1.25fr .75fr .75fr!important','grid-template-columns:repeat(2,minmax(0,1fr))!important')
          s=s.replace('JUMPER analyse ton PDF et croise avec tes ventes...','TBR analyse ton PDF et croise avec tes ventes...')
          s=s.replace('et les scénarios JUMPER.','et tes projections.')
          s=s.replace('dans JUMPER pour suivre ce qu’il reste à aller chercher.','dans les projections pour suivre ce qu’il reste à aller chercher.')
          s=s.replace('/* On retire le robot actuel, trop gadget, sans casser JUMPER */','/* Ancien robot visuel retiré */')

          old='const APP_VERSION = "8.30.1-aimt-rules";'
          if s.count(old)!=1:
              raise SystemExit(f'APP_VERSION expected once, found {s.count(old)}')
          s=s.replace(old,'const APP_VERSION = "8.30.2-no-jumper";',1)

          forbidden=['function getJumperSuggestion','JUMPERS_MODES','JUMPER_NIVEAUX','getJumperCoachPlan','function JumpersFloat','<JumpersFloat','<span>JUMPER</span>','jumper_onboarding','jumper_profile','JUMPER analyse ton PDF','scénarios JUMPER','dans JUMPER pour suivre']
          remain=[x for x in forbidden if x in s]
          if remain:
              raise SystemExit('JUMPER still present: '+', '.join(remain))

          required_ai=['function TbrAiAssistant','TBR_AI_API_URL','<TbrAiAssistant']
          missing=[x for x in required_ai if x not in s]
          if missing:
              raise SystemExit('TBR IA unexpectedly altered: '+', '.join(missing))

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate preserved app
        run: |
          set -euo pipefail
          grep -q '8.30.2-no-jumper' index.html
          ! grep -q 'function getJumperSuggestion' index.html
          ! grep -q 'getJumperCoachPlan' index.html
          ! grep -q '<JumpersFloat' index.html
          ! grep -q '<span>JUMPER</span>' index.html
          grep -q 'function TbrAiAssistant' index.html
          grep -q 'TBR_AI_API_URL' index.html
          grep -q '<TbrAiAssistant' index.html
          grep -q 'tbr-ai-ui-v2.js' vercel.json
          grep -q '"/api/ai"' vercel.json
          test -f ai.js
          test -f tbr-ai-context.js
          test -f tbr-ai-ui-v2.js
          node validate-dco-build.js
          node tests/dco-final-reliability-check.js

      - name: Commit feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: remove JUMPER only'
          git push origin HEAD:chore/remove-jumper-only
