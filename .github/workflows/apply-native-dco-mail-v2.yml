name: Apply native DCO claim mail v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-native-dco-mail-v2.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply native mail patch
        run: |
          set -euo pipefail
          python .github/scripts/patch_native_dco_mail_v2.py
          grep -q 'id="dco-native-mail-v2"' index.html
          grep -q 'Préparer ma réclamation DCO' index.html
          grep -q 'Préparer le mail détaillé' index.html

      - name: Parse complete React JSX
        run: |
          set -euo pipefail
          rm -rf /tmp/tbr-parse && mkdir -p /tmp/tbr-parse
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script\s+type=["\']text/babel["\'][^>]*>([\s\S]*?)</script>',html,flags=re.I)
          if len(blocks)!=1:
              raise SystemExit(f'Expected one text/babel block, found {len(blocks)}')
          Path('/tmp/tbr-parse/app.jsx').write_text(blocks[0],encoding='utf-8')
          PY
          cd /tmp/tbr-parse
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund @babel/parser@7
          node - <<'NODE'
          const fs=require('fs');
          const parser=require('@babel/parser');
          parser.parse(fs.readFileSync('app.jsx','utf8'),{sourceType:'script',plugins:['jsx']});
          console.log('Babel JSX parse: OK');
          NODE

      - name: Commit native integration
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Native mail already present'
            exit 0
          fi
          git config user.name 'TBR Native DCO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'feat: intégrer le mail de réclamation dans Contrôle DCO'
          git push
