name: DCO parser hardening

on:
  push:
    branches:
      - fix/dco-multiformat-parser

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dco-multiformat-parser
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply hardening patch
        run: python3 tools/patch_dco_parser_hardening.py
      - name: Validate hardened DCO runtime
        run: |
          node --check tbr-dco-parser.js
          node --check tbr-dco-engine.js
          node --check tbr-dco-claim-mail.js
          node tests/dco-parser-multiformat-check.js
          node tests/dco-final-reliability-check.js
          node validate-dco-build.js
      - name: Commit hardening
        shell: bash
        run: |
          git rm -f .github/workflows/dco-parser-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: harden DCO parser against zero rows and volume drift"
          git push origin HEAD:fix/dco-multiformat-parser
