name: TBR AIMT and DCO rules test

on:
  push:
    branches: [tbr-aimt-fix]
    paths:
      - '.github/workflows/tbr-aimt-inspect.yml'
      - 'tools/apply_aimt_fix.py'
      - 'tools/patch_dco_multipage_names.py'
      - 'index.html'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/apply_aimt_fix.py'
      - 'tools/patch_dco_multipage_names.py'
      - '.github/workflows/tbr-aimt-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tbr-aimt-fix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep cancellation rules current
        run: |
          if grep -q 'TBR_AIMT_IMPACT_REASONS=\["AIMT","ALIT","ASAT"\]' index.html; then
            echo 'AIMT rules already current'
          else
            python3 tools/apply_aimt_fix.py
          fi

      - name: Apply DCO multiline and multipage parser
        run: |
          if grep -q 'function parseClientRows(pages)' index.html; then
            echo 'DCO parser already current'
          else
            python3 tools/patch_dco_multipage_names.py
          fi

      - name: Verify exact rules and client case
        run: |
          grep -q 'TBR_AIMT_IMPACT_REASONS=\["AIMT","ALIT","ASAT"\]' index.html
          grep -q 'Aucun impact sur les ventes, les VD/VF ou les paliers' index.html
          grep -q 'function parseClientRows(pages)' index.html
          grep -q 'let pendingNb=null;' index.html
          grep -q 'const allPageLines=\[\];' index.html
          grep -q 'const rows=parseClientRows(allPageLines);' index.html
          grep -q 'const installs=parseInstallRows(allText);' index.html
          python3 - <<'PY'
          lines=['1','2201228','PREFECTURE DES','BOUCHES DU','RHONE SGC 13','PURVD 24 mois 1115 380 278,75 ACQ start']
          pending=None
          current=''
          for line in lines:
              if line in {'-1','0','1'}:
                  pending=int(line)
              elif pending is not None and line.isdigit():
                  current=f'{pending} {line}'
                  pending=None
              elif current:
                  current += ' '+line
          assert current == '1 2201228 PREFECTURE DES BOUCHES DU RHONE SGC 13 PURVD 24 mois 1115 380 278,75 ACQ start'
          print('Client 2201228 multiline case validated')
          PY

      - name: Commit tested application
        run: |
          if git diff --quiet -- index.html; then
            echo 'Application already current'
            exit 0
          fi
          git config user.name 'TBR Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix DCO multiline clients and scan all pages'
          git push origin HEAD:tbr-aimt-fix
