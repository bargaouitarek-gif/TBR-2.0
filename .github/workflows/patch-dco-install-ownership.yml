name: Patch DCO installation ownership

on:
  push:
    branches:
      - fix/dco-install-ownership
    paths:
      - '.github/workflows/patch-dco-install-ownership.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dco-install-ownership
      - name: Bump DCO claim runtime loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='src="./tbr-dco-claim-mail.js?v=1.6.0"'
          new='src="./tbr-dco-claim-mail.js?v=1.7.0"'
          if old not in s:
              if new in s:
                  print('Loader already updated')
              else:
                  raise SystemExit('Claim loader not found')
          else:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY

          grep -q 'src="./tbr-dco-claim-mail.js?v=1.7.0"' index.html
          node --check tbr-dco-claim-mail.js
          node tests/dco-final-reliability-check.js

      - name: Commit loader patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(dco): load installation ownership runtime"
          git push origin HEAD:fix/dco-install-ownership
