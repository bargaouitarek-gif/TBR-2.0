name: DCO cleanup step5

on:
  push:
    branches:
      - refactor/dco-cleanup-step5

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dco-cleanup-step5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply cleanup patch
        run: python3 tools/dco-cleanup-step5.py
      - name: Validate DCO runtime
        run: |
          node validate-dco-build.js
          node tests/dco-final-reliability-check.js
      - name: Commit cleaned runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dco-cleanup-step5.yml tools/dco-cleanup-step5.py
          git add index.html tbr-dco-engine.js tbr-dco-claim-mail.js tests/dco-final-reliability-check.js validate-dco-build.js
          git commit -m "refactor: remove duplicate DCO totals and alerts"
          git push origin HEAD:refactor/dco-cleanup-step5
