name: TBR DCO multipage fix

on:
  push:
    branches: [tbr-aimt-fix]
    paths:
      - '.github/workflows/tbr-dco-multipage-fix.yml'
      - 'tools/patch_dco_multipage_names.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tbr-aimt-fix
          fetch-depth: 0
      - name: Apply parser correction
        run: python3 tools/patch_dco_multipage_names.py
      - name: Validate correction
        run: |
          grep -q 'function parseClientRows(pages)' index.html
          grep -q 'const allPageLines=\[\];' index.html
          grep -q 'const rows=parseClientRows(allPageLines);' index.html
          grep -q 'const installs=parseInstallRows(allText);' index.html
      - name: Commit correction
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'TBR Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix DCO clients split across pages and lines'
          git push
