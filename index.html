<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="tbr-icon.svg" type="image/svg+xml">
  <title>TBR — Réparation complète</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.boot{max-width:560px;padding:28px;text-align:center}.boot b{display:block;font-size:26px;margin-bottom:10px}.boot span{display:block;opacity:.76;line-height:1.5}.boot-error{padding:28px;color:#fecaca;font-weight:800;text-align:center}.repair{margin-top:22px;width:100%;border:0;border-radius:16px;padding:16px;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;font-size:15px;font-weight:950}
  </style>
</head>
<body>
  <div class="boot" id="boot-msg"><b>Réparation complète de TBR…</b><span>Suppression des anciens fichiers techniques en cache. Tes ventes et tes réglages sont conservés.</span></div>
  <script>
  (async()=>{
    const APP_VERSION="2026.08.02-cache-reset-v20";
    const VERSION_KEY="tbr.app.installed.version";
    const LEGACY_VERSION_KEY="cc_version";
    const query=new URLSearchParams(location.search);
    const target=document.getElementById("boot-msg");

    async function clearTechnicalCache(){
      try{
        if("serviceWorker" in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister().catch(()=>false)));
        }
      }catch(error){console.warn("Désinscription service worker incomplète",error);}
      try{
        if("caches" in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(key=>/^tbr-/i.test(key)).map(key=>caches.delete(key)));
        }
      }catch(error){console.warn("Nettoyage cache incomplet",error);}
    }

    const needsReset=query.get("clean")!=="done"||sessionStorage.getItem("tbr.v20.cleaned")!=="yes";
    if(needsReset){
      await clearTechnicalCache();
      sessionStorage.setItem("tbr.v20.cleaned","yes");
      localStorage.setItem(VERSION_KEY,APP_VERSION);
      localStorage.setItem(LEGACY_VERSION_KEY,APP_VERSION);
      target.innerHTML="<b>Ancien moteur supprimé ✓</b><span>Rechargement propre de TBR…</span>";
      await new Promise(resolve=>setTimeout(resolve,450));
      const next=new URL(location.href);
      next.search="";
      next.searchParams.set("clean","done");
      next.searchParams.set("v",Date.now().toString());
      location.replace(next.href);
      return;
    }

    localStorage.setItem(VERSION_KEY,APP_VERSION);
    localStorage.setItem(LEGACY_VERSION_KEY,APP_VERSION);
    target.innerHTML="<b>TBR redémarre proprement…</b><span>Chargement du moteur sécurisé.</span>";

    await new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      script.src=new URL(`document-intake-entry-v14.js?v=${encodeURIComponent(APP_VERSION)}-${Date.now()}`,location.href).href;
      script.async=true;
      script.onload=resolve;
      script.onerror=()=>reject(new Error("Le moteur TBR n’a pas pu être téléchargé"));
      document.head.appendChild(script);
    });
  })().catch(error=>{
    console.error(error);
    const target=document.getElementById("boot-msg");
    if(target){
      target.className="boot-error";
      target.innerHTML="TBR n’a pas pu terminer la réparation : "+(error&&error.message?error.message:error)+"<br><button class='repair' onclick='location.reload()'>Réessayer</button>";
    }
  });
  </script>
</body>
</html>
